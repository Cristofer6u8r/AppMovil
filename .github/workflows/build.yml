name: Compilar APK Android
on: 
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Descargar el código
      uses: actions/checkout@v3

    - name: Configurar .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x'

    - name: Instalar MAUI y dependencias
      run: dotnet workload install maui

    - name: Compilar el archivo APK
      run: dotnet publish -f net10.0-android -c Release -p:AndroidPackageFormat=apk

    - name: Guardar el APK final
      uses: actions/upload-artifact@v3
      with:
        name: GestorTareas-APK
        path: '**/*-Signed.apk'